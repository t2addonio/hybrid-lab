system:
  name: Edge Bridge
  version: 0.1.0-bridge
  local_first: true
  require_human_override: true
  sibling_of: artifacts/multi_agent
backends:
  ollama:
    enabled: true
    base_url: http://localhost:11434/v1
    api_key: ollama
    timeout_s: 180
    default_model: tonyedge:latest
  grok:
    enabled: false
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    timeout_s: 90
    default_model: grok-4.6
  openai:
    enabled: false
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout_s: 90
    default_model: gpt-5.4
  anthropic:
    enabled: false
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    timeout_s: 90
    default_model: claude-sonnet-4-6
routing:
  default_backend: ollama
  roles:
    coordinator:
      preferred_backend: ollama
      model: tonyedge:latest
      fallback_backend: null
    researcher:
      preferred_backend: grok
      model: grok-4.6
      fallback_backend: ollama
      fallback_model: tonyedge:latest
    critic:
      preferred_backend: ollama
      model: tonyedge:latest
      fallback_backend: null
    coder:
      preferred_backend: ollama
      model: tonyedge:latest
      fallback_backend: null
    architect:
      preferred_backend: grok
      model: grok-4.6
      fallback_backend: ollama
      fallback_model: tonyedge:latest
bridge:
  allowed_consults:
    - ollama
    - grok
    - openai
    - anthropic
  max_consults_per_turn: 4
  frontends_write_shared_board: false
  private_namespaces: true
safety:
  never_log_api_keys: true
  decision_protocol: strict
  require_explicit_handoff: true
